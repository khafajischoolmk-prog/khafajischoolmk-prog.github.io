<title>مدرسة إبراهيم خفاجي الابتدائية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Readex+Pro:wght@500;600;700&display=swap" media="print" onload="this.media='all'">
<style>
/* Layout: a school-office portal — a deep green-teal masthead carrying the ministry logo, icon tabs beneath, one working column of soft cards; printable sheets drawn on white A4 paper. */
:root{
  --bg:#eef4f2; --surface:#ffffff; --sunk:#e6efec; --ink:#12302b; --muted:#587069; --line:#d5e2de;
  --teal:#0e7466; --teal-2:#0b5f54; --teal-ink:#ffffff; --teal-soft:#dcefea; --blue:#1d5e8d; --blue-soft:#e1ecf5;
  --gold:#b88a2a; --gold-soft:#f7efdc;
  --amber:#9a5b00; --amber-soft:#fff1d6; --red:#b3261e; --red-soft:#fbe4e2; --ok:#1d7340; --ok-soft:#e1f3e7;
  --shadow:0 1px 2px rgba(18,48,43,.06),0 6px 20px rgba(18,48,43,.06);
  --font:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
  --display:"Readex Pro","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --sheet-font:Arial,"IBM Plex Sans Arabic",Tahoma,sans-serif;
  --p-bg:#ffffff; --p-ink:#0a1614; --p-muted:#33463f; --p-line:#9db3ad; --p-band:#e4f3ee; --p-teal:#0f7a6d; --p-amber:#a35f00; --p-amber-bg:#fff4dd; --p-ok:#1d7340;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1716; --surface:#14211f; --sunk:#1a2b28; --ink:#e2eeeb; --muted:#9bb2ad; --line:#263936;
  --teal:#4fc2b1; --teal-2:#2f9c8c; --teal-ink:#06201c; --teal-soft:#173a35; --blue:#7db7e3; --blue-soft:#17303f;
  --gold:#e0b65a; --gold-soft:#3a3018;
  --amber:#f1b54d; --amber-soft:#3a2b0e; --red:#f19a92; --red-soft:#3d1a18; --ok:#7fd39c; --ok-soft:#173222;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.6;direction:rtl}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.3;font-family:var(--display);font-weight:600}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
[hidden]{display:none!important}

/* masthead */
.mast{background:linear-gradient(135deg,#0b5f54 0%,#0e7466 55%,#1d5e8d 120%);color:#fff;padding-inline:16px;padding-block:18px 64px;position:relative;overflow:hidden}
.mast::after{content:"";position:absolute;inset:auto -10% -60px -10%;height:120px;background:radial-gradient(60% 100% at 50% 0,rgba(255,255,255,.10),transparent 70%)}
.mast-in{max-width:1020px;margin-inline:auto;display:flex;align-items:center;gap:16px;flex-wrap:wrap;position:relative;z-index:1}
.mast .logo{width:96px;height:84px;object-fit:contain;background:#fff;border-radius:14px;padding:7px;box-shadow:0 4px 14px rgba(0,0,0,.18);flex:none}

@media (max-width:560px){}
.mast .t{flex:1;min-width:0;text-align:center}
.mast h1{font-size:1.45rem;color:#fff}
.mast .sub{opacity:.85;font-size:.9rem}
.who{display:flex;align-items:center;gap:8px;font-size:.88rem;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);padding:6px 10px;border-radius:999px}
.who button{background:none;border:0;color:#fff;text-decoration:underline;cursor:pointer;padding:0 4px}
.wrap{max-width:1020px;margin-inline:auto;padding-inline:16px;padding-block:0 48px;margin-top:-44px;position:relative;z-index:2}

/* nav */
.nav{display:flex;gap:6px;background:var(--surface);border-radius:16px;padding:6px;box-shadow:var(--shadow);overflow-x:auto;margin-bottom:16px}
.nav button{flex:1 0 auto;display:flex;align-items:center;justify-content:center;gap:8px;border:0;background:transparent;border-radius:12px;padding:11px 14px;font-weight:600;font-size:.98rem;cursor:pointer;color:var(--muted);white-space:nowrap}
.nav button svg{width:20px;height:20px;flex:none}
.nav button,.drawer button{--c:var(--teal);--cs:var(--teal-soft)}
[data-tab="att"]{--c:#0e7466!important;--cs:#dcefea!important}
[data-tab="sheets"]{--c:#1d5e8d!important;--cs:#e1ecf5!important}
[data-tab="skills"]{--c:#6a4c9c!important;--cs:#ece6f5!important}
[data-tab="works"]{--c:#a8741a!important;--cs:#f7efdc!important}
[data-tab="soon"]{--c:#b04a5a!important;--cs:#f8e4e7!important}
[data-tab="admin"]{--c:#3d5a80!important;--cs:#e3e9f1!important}
[data-tab="home"]{--c:#0b5f54!important;--cs:#dcefea!important}
[data-tab="teacher"]{--c:#1d5e8d!important;--cs:#e1ecf5!important}
[data-tab="staff"]{--c:#a8741a!important;--cs:#f7efdc!important}
[data-tab="sup"]{--c:#6a4c9c!important;--cs:#ece6f5!important}
.nav button svg{color:var(--c)}
.nav button[aria-current="true"]{background:var(--c);color:#fff}
.nav button[aria-current="true"] svg{color:#fff}
.nav button:hover:not([aria-current="true"]){background:var(--cs);color:var(--ink)}
.menu-btn{width:42px;height:42px;border-radius:12px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.14);color:#fff;display:grid;place-items:center;cursor:pointer;flex:none}
.menu-btn svg{width:22px;height:22px}
.drawer-bg{position:fixed;inset:0;background:rgba(10,30,27,.45);z-index:50;opacity:0;pointer-events:none;transition:opacity .2s}
.drawer{position:fixed;top:0;bottom:0;right:0;width:min(290px,82vw);background:var(--surface);z-index:51;transform:translateX(105%);transition:transform .22s ease;box-shadow:-8px 0 30px rgba(0,0,0,.18);display:flex;flex-direction:column;padding:16px 12px;gap:6px;overflow-y:auto}
body.dr-open .drawer{transform:none}
body.dr-open .drawer-bg{opacity:1;pointer-events:auto}
.drawer .dh{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:4px 6px 12px;border-bottom:1px solid var(--line);margin-bottom:6px}
.drawer .dh b{font-family:var(--display);font-size:1.05rem;color:var(--ink)}
.drawer .dx{border:0;background:var(--sunk);width:34px;height:34px;border-radius:10px;cursor:pointer;font-size:1.2rem;color:var(--muted)}
.drawer button.di{display:flex;align-items:center;gap:12px;border:0;background:transparent;border-radius:12px;padding:12px;font:inherit;font-weight:600;font-size:1rem;color:var(--ink);cursor:pointer;text-align:start}
.drawer button.di .ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:var(--cs);color:var(--c);flex:none}
.drawer button.di .ic svg{width:21px;height:21px}
.drawer button.di[aria-current="true"]{background:var(--cs)}
.drawer button.di:hover{background:var(--cs)}
.drawer .dfoot{margin-top:auto;padding-top:12px;border-top:1px solid var(--line)}
.subnav{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.subnav button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;cursor:pointer;font-size:.9rem}
.subnav button[aria-current="true"]{background:var(--blue);color:#fff;border-color:var(--blue)}

/* cards & forms */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;display:grid;gap:14px;box-shadow:var(--shadow)}
.panel+.panel{margin-top:14px}
.panel h2{font-size:1.15rem}
.ph{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.hint{color:var(--muted);font-size:.88rem}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
label.f{display:grid;gap:4px;font-size:.85rem;color:var(--muted);min-width:0}
input,select,textarea{border:1px solid var(--line);background:var(--bg);border-radius:11px;padding:10px 12px;font-size:1rem;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--teal);outline:none;box-shadow:0 0 0 3px var(--teal-soft)}
textarea{min-height:90px}
.btn{border:0;border-radius:12px;padding:11px 18px;font-weight:600;font-size:1rem;cursor:pointer;background:var(--teal);color:var(--teal-ink);display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn:hover{background:var(--teal-2)}
.btn.sec{background:var(--sunk);color:var(--ink);border:1px solid var(--line)}
.btn.blue{background:var(--blue);color:#fff}
.btn.gold{background:var(--gold);color:#fff}
.btn.sm{padding:6px 12px;font-size:.88rem;border-radius:9px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.note{border-radius:12px;padding:12px 14px;font-size:.92rem}
.note.amber{background:var(--amber-soft);color:var(--amber)}
.note.ok{background:var(--ok-soft);color:var(--ok)}
.note.red{background:var(--red-soft);color:var(--red)}
.note.blue{background:var(--blue-soft);color:var(--blue)}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:999px;background:var(--teal-soft);color:var(--teal);font-size:.8rem;font-weight:500;white-space:nowrap}
.chip.blue{background:var(--blue-soft);color:var(--blue)}
.chip.amber{background:var(--amber-soft);color:var(--amber)}
.chip.red{background:var(--red-soft);color:var(--red)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.gold{background:var(--gold-soft);color:var(--gold)}

/* stat tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;box-shadow:var(--shadow);display:grid;gap:2px}
.tile span{color:var(--muted);font-size:.85rem}
.tile b{font-family:var(--display);font-size:1.9rem;font-variant-numeric:tabular-nums;line-height:1.2}
.tile.warn b{color:var(--amber)}
.tile.good b{color:var(--ok)}

/* hero (teacher) */
.hello{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.hello .av{width:52px;height:52px;border-radius:16px;background:var(--gold-soft);color:var(--gold);display:grid;place-items:center;font-family:var(--display);font-size:1.4rem;font-weight:700}
.hello h2{font-size:1.25rem}

/* login & landing */
.center{max-width:460px;margin-inline:auto}
.badge-ic{width:56px;height:56px;border-radius:16px;background:var(--teal-soft);color:var(--teal);display:grid;place-items:center}

/* teacher bag */
.req{border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:10px;background:var(--bg)}
.req h3{font-size:1.02rem}
.req .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.file{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.file .nm{font-weight:500;min-width:0;overflow-wrap:anywhere}
.drop{border:2px dashed var(--line);border-radius:12px;padding:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.matrix td,.matrix th{white-space:nowrap}
/* teachers' works */
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.tcard{display:grid;justify-items:center;gap:8px;text-align:center;border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:16px 10px;cursor:pointer;box-shadow:var(--shadow);color:var(--ink);font:inherit;transition:border-color .15s,transform .15s}
.tcard:hover,.tcard:focus-visible{border-color:var(--teal);transform:translateY(-2px)}
.tcard .av{width:54px;height:54px;border-radius:16px;background:var(--gold-soft);color:var(--gold);display:grid;place-items:center;font-family:var(--display);font-size:1.4rem;font-weight:700}
.tcard b{font-size:.95rem;line-height:1.4}
.tcard span{font-size:.8rem;color:var(--muted)}
.pinbox{display:flex;gap:8px;flex-wrap:wrap;align-items:end}
.pinbox input{max-width:160px;text-align:center;letter-spacing:.4em;font-size:1.3rem;font-variant-numeric:tabular-nums}
.secd{margin:-4px 0 0;padding:0;list-style:none;color:var(--muted);font-size:.8rem;line-height:1.65}
.sedit{border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:8px;background:var(--bg)}
.sedit .top{display:flex;gap:8px;align-items:end;flex-wrap:wrap}
.sedit .num{width:34px;height:34px;border-radius:10px;background:var(--gold-soft);color:var(--gold);display:grid;place-items:center;font-weight:700;flex:none}
.sedit textarea{min-height:108px}
.secgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.note.gold{background:var(--gold-soft);color:var(--gold)}

/* ===== قوائم داخلية أوضح (المستوى الثاني والثالث) ===== */
.subnav{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:8px;box-shadow:var(--shadow);margin:2px 0 16px}
.subnav[hidden]{display:none}
.subnav-h{grid-column:1/-1;display:flex;align-items:center;gap:7px;padding:2px 6px 7px;margin-bottom:2px;border-bottom:1px dashed var(--line);color:var(--teal);font-weight:800;font-size:.88rem}
.subnav-h svg{width:17px;height:17px}.subnav-h small{margin-inline-start:auto;color:var(--muted);font-weight:600;font-size:.74rem}
.subnav button{border:1px solid transparent;background:var(--bg);border-radius:10px;padding:9px 8px;font:inherit;font-weight:700;font-size:.85rem;line-height:1.35;color:var(--ink);text-align:center;cursor:pointer;transition:background .15s}
.subnav button:hover{background:var(--teal-soft)}
.subnav button[aria-current="true"]{background:var(--blue);border-color:var(--blue);color:var(--surface);box-shadow:0 3px 10px rgba(29,94,141,.28)}
#av .segs:not(.sm):not(.agrp){display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;background:transparent;margin:0 0 14px;padding:10px;border:1px solid var(--line);border-radius:14px;background:linear-gradient(var(--surface),var(--surface)) padding-box}
#av .segs:not(.sm):not(.agrp) button{justify-content:flex-start;text-align:start;background:var(--surface);border:1px solid var(--line);border-inline-start:4px solid var(--line);border-radius:10px;box-shadow:none;padding:9px 11px;font-size:.86rem;font-weight:700;line-height:1.35;color:var(--ink)}
#av .segs:not(.sm):not(.agrp) button:hover{border-inline-start-color:var(--teal)}
#av .segs:not(.sm):not(.agrp) button[aria-current="true"]{background:var(--teal-soft);color:var(--teal);border-color:var(--teal);border-inline-start-color:var(--teal)}
#av .segs:not(.sm):not(.agrp) button[aria-current="true"] svg{color:var(--teal)}
@media (max-width:560px){.subnav{grid-template-columns:repeat(2,1fr)}#av .segs:not(.sm):not(.agrp){grid-template-columns:repeat(2,1fr);padding:8px}}

/* ===== v65: شريط المعلم، اختيار الاسم المضغوط، شريط الوقت، أعمال المعلمين ===== */
#tSeg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
#tSeg button{flex-direction:column;justify-content:center;gap:4px;padding:9px 4px;font-size:.78rem;line-height:1.25;text-align:center;border-radius:12px;min-height:62px;box-shadow:none}
#tSeg button svg{width:20px;height:20px}
@media (min-width:900px){#tSeg{grid-template-columns:repeat(8,minmax(0,1fr))}#tSeg button{font-size:.84rem}}
.tpick{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
.tpick input{flex:1;min-width:170px}
.tgrid.tc{grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin-top:10px}
@media (min-width:720px){.tgrid.tc{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (min-width:1050px){.tgrid.tc{grid-template-columns:repeat(4,minmax(0,1fr))}}
.tgrid.tc .tcard{display:flex;align-items:center;justify-items:start;gap:8px;text-align:start;padding:7px 9px;border-radius:12px;box-shadow:none;min-height:48px}
.tgrid.tc .tcard:hover{transform:none}
.tgrid.tc .tcard .av{width:32px;height:32px;border-radius:10px;font-size:1rem;flex:none}
.tgrid.tc .tcard b{font-size:.84rem;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tgrid.tc .tcard span{display:none}
.tgrid.tc .tcard.last{border-color:var(--gold)}
.tgrid.tc .tcard.last .av{background:var(--gold);color:#fff}
.nowbar{display:flex;align-items:stretch;margin:0 0 14px;border-radius:18px;overflow:hidden;background:linear-gradient(135deg,#0f7a6d 0%,#0b5d52 58%,#08463e 100%);color:#fff;box-shadow:var(--shadow);min-height:76px}
.nowbar .nb-c{display:grid;place-items:center;align-content:center;gap:2px;padding:8px 18px;background:rgba(0,0,0,.18);min-width:118px;text-align:center}
.nowbar .nb-c b{font-size:1.65rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.05;letter-spacing:.3px;white-space:nowrap}
.nowbar .nb-c small{font-size:.82rem;font-weight:700;opacity:.92}
.nowbar .nb-s{flex:1 1 0;min-width:0;padding:9px 16px 11px;display:grid;align-content:center;gap:2px;position:relative;border-inline-start:1px solid rgba(255,255,255,.22)}
.nowbar .nb-s span{font-size:.8rem;font-weight:700;opacity:.88}
.nowbar .nb-s b{font-size:1.18rem;font-weight:800;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nowbar .nb-s small{font-size:.84rem;font-weight:600;opacity:.95;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nowbar .nb-s.br b{color:#ffd76a}
.nowbar .nb-s i{position:absolute;inset-inline-start:0;bottom:0;height:4px;width:var(--p,0%);background:#ffd76a;border-start-end-radius:3px;border-end-end-radius:3px}
@media(max-width:560px){.nowbar{flex-wrap:wrap;min-height:0}.nowbar .nb-c{flex:1 0 100%;grid-auto-flow:column;gap:10px;padding:7px 12px;justify-content:center}.nowbar .nb-c b{font-size:1.35rem}
 .nowbar .nb-s{padding:8px 12px 10px}.nowbar .nb-s:nth-child(2){border-inline-start:0}.nowbar .nb-s b{font-size:1.02rem}.nowbar .nb-s small{font-size:.78rem}}
@media (max-width:560px){.nowbar{grid-template-columns:1fr 1fr}.nowbar .clk{grid-column:1/-1;display:flex;justify-content:center;gap:12px;padding:8px 12px}.nowbar .clk b{font-size:1.35rem}}
.sw-list{display:grid;gap:6px;margin-top:10px}
.sw-it{border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.sw-it.op{border-color:var(--teal);box-shadow:var(--shadow)}
.sw-h{display:flex;align-items:center;gap:8px;width:100%;border:0;background:transparent;padding:9px 12px;font:inherit;color:var(--ink);cursor:pointer;text-align:start}
.sw-h b{flex:1;min-width:0;font-size:.92rem}
.sw-ar{color:var(--teal);width:14px}
.sw-pr{width:90px;height:8px;border-radius:5px;background:#eef3f5;overflow:hidden;flex:none}
.sw-pr i{display:block;height:100%}
.sw-n{min-width:46px;text-align:left;margin:0}
.sw-b{border-top:1px dashed var(--line);padding:8px 12px 10px;display:grid;gap:8px;background:var(--bg)}
.sw-sec{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;display:grid;gap:6px}
.sw-st{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.sw-f{display:flex;gap:8px;align-items:center;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:6px}
.sw-f .nm{font-weight:700;color:var(--blue);word-break:break-all}
.sw-act{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-inline-start:auto}
.sw-act input{width:150px;padding:5px 8px}
.sw-miss{display:flex;gap:4px;flex-wrap:wrap}
@media (max-width:560px){.sw-pr{width:56px}.sw-act{margin-inline-start:0;width:100%}.sw-act input{flex:1}}

:root{--font:"Tajawal","IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;--display:"Tajawal","Readex Pro","IBM Plex Sans Arabic",Tahoma,sans-serif;--ui-g1:#0b6b5c;--ui-g2:#118a74;--ui-g3:#0a5e51;--ui-sh:0 2px 6px rgba(16,60,52,.05),0 10px 28px rgba(16,60,52,.08);--ui-bg1:#ffffff;--ui-bg2:#f3faf7}
html{background:var(--bg)}body{background:linear-gradient(180deg,#fff 0,#f2f8f6 420px,var(--bg) 900px)}

.mC .mbar .who{flex-basis:auto!important;justify-content:flex-end;margin-inline-start:auto}
.mast.mC{background:none;color:var(--ink);padding:0;overflow:visible}

.mC .mwave{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.mC .mbar{position:absolute;top:0;left:0;right:0;height:58px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 46px;z-index:3;background:rgba(255,255,255,.78);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-radius:0 0 26px 26px}
.mC .msn{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.02rem;color:var(--ink)}
.mC .msn img{height:38px;width:auto}
.mC .menu-btn{background:#fff;border:1px solid var(--line);color:var(--ui-g1);width:40px;height:40px;border-radius:12px;display:grid;place-items:center;cursor:pointer}.mC .menu-btn svg{width:22px;height:22px}
.mC .who{background:none;border:0;padding:0;color:var(--ink);gap:14px;font-size:.95rem}
.mC .who button{color:var(--ink);text-decoration:none;display:inline-flex;align-items:center;gap:6px;font:inherit;font-weight:600}
.mC .who button svg,.mC .who .uav svg{width:20px;height:20px}
.mC .who i{width:1px;height:22px;background:#c9d6d2}
.mC .who .uav{width:38px;height:38px;border-radius:50%;background:var(--ui-g1);color:#fff;display:grid;place-items:center}
.mC .who .chip{font-size:.75rem}
.mC .mhero{position:absolute;right:46px;top:92px;display:flex;gap:30px;align-items:center;z-index:3}
.mC .mhero .logo{width:150px;height:auto;background:none;box-shadow:none;border-radius:0;padding:0 0 0 30px;border-left:1.5px solid #c7d9d4}
.mC .mhero .t{text-align:center}
.mC .mhero h1{margin:0;font-size:2.55rem;font-weight:800;color:#0d4f45;font-family:var(--display)}
.mC .mhero .msub{margin:10px 0 0;font-size:1.35rem;color:#24433d}
.mC .mhero .sub{margin-top:4px;color:var(--muted)}
.mC .mhero .t>i{display:block;width:120px;height:3px;background:var(--ui-g2);border-radius:3px;margin:16px auto 0}
.wrap{max-width:1640px;margin-top:0;padding-inline:46px}
/* الشريط الرئيسي */
.nav{max-width:860px;margin:6px auto 22px;border-radius:22px;padding:6px;background:#fff;box-shadow:var(--ui-sh)}
.nav:has(button:only-child){display:none}
.nav button{border-radius:16px;font-weight:700;font-size:1rem;padding:12px 14px;color:#24433d}
.nav button[aria-current="true"]{background:linear-gradient(160deg,var(--ui-g2),var(--ui-g3))!important;color:#fff!important;box-shadow:0 6px 14px rgba(10,94,81,.28)}
.nav button[aria-current="true"] svg{color:#fff!important}
/* بطاقات المجموعات */
.cgr{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:18px;margin:4px 0 0}
.cg{border:1px solid rgba(255,255,255,.8);border-radius:22px;padding:22px 16px 20px;text-align:center;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;box-shadow:var(--ui-sh);cursor:pointer;min-height:150px;color:var(--ink);font:inherit;transition:transform .15s,box-shadow .15s}
.cg:hover{transform:translateY(-3px)}
.cg>svg{width:42px;height:42px;margin-bottom:4px}
.cg b{font-size:1.12rem;font-weight:800;line-height:1.35}.cg small{font-size:.9rem;color:#3f5d57}
.cg .chev{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#fff;color:var(--ui-g1);box-shadow:0 2px 8px rgba(0,0,0,.08)}.cg .chev svg{width:16px;height:16px}
.cg .bdg,.cpill .bdg,.csub .subnav .bdg{position:absolute;top:12px;left:calc(50% - 46px);margin:0;min-width:24px;height:22px;font-size:.78rem;background:#e2492f}
.cpill .bdg{top:4px;left:14px}.csub .subnav .bdg{position:static;margin-inline-start:4px}
.cg.t0{background:linear-gradient(160deg,#f3fbf7,#e3f4ec)}.cg.t0>svg{color:#0f8a5f}
.cg.t1{background:linear-gradient(160deg,#f6fbf2,#e9f5e4)}.cg.t1>svg{color:#18865a}
.cg.t2{background:linear-gradient(160deg,#f2f8fd,#e3eef9)}.cg.t2>svg{color:#1a73c9}
.cg.t3{background:linear-gradient(160deg,#effafa,#dff3f3)}.cg.t3>svg{color:#13897f}
.cg.t4{background:linear-gradient(160deg,#f7f3fe,#ece4fb)}.cg.t4>svg{color:#7a49d6}
.cg.t5{background:linear-gradient(160deg,#fdf6ee,#f9e9d6)}.cg.t5>svg{color:#c47a1d}
.cg[aria-current="true"]{background:linear-gradient(160deg,var(--ui-g2),var(--ui-g3));color:#fff;transform:translateY(-10px);box-shadow:0 16px 30px rgba(10,94,81,.35)}
.cg[aria-current="true"]>svg{color:#fff}.cg[aria-current="true"] small{color:#d9f1ea}
.cpill{margin:20px auto 0;max-width:1320px;background:#fff;border-radius:26px;box-shadow:var(--ui-sh);display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));padding:8px}
.cpill button{display:flex;align-items:center;justify-content:center;gap:12px;padding:16px 10px;font:inherit;font-weight:700;font-size:1.08rem;border-radius:20px;position:relative;border:0;background:none;color:var(--ink);cursor:pointer}
.cpill button+button::before{content:"";position:absolute;right:0;top:22%;height:56%;width:1px;background:#dbe5e2}
.cpill button svg{color:var(--ui-g1);width:28px;height:28px;flex:none}
.cpill button[aria-current="true"]{background:var(--ui-g1);color:#fff}.cpill button[aria-current="true"] svg{color:#fff}
.cpill button[aria-current="true"]::before,.cpill button[aria-current="true"]+button::before{display:none}
/* الأقسام الفرعية */
.csub{margin:26px 0 18px;display:flex;gap:24px;align-items:flex-end}
.csub .cpn{flex:1;min-width:0;background:#fff;border-radius:24px 0 24px 24px;box-shadow:var(--ui-sh);padding:22px 24px 22px;position:relative;margin-top:46px}
.csub .ctag{position:absolute;right:0;top:-46px;background:linear-gradient(160deg,var(--ui-g2),var(--ui-g3));color:#fff;height:48px;padding:0 24px 0 56px;display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.1rem;border-radius:24px 24px 0 0;clip-path:polygon(0 100%,9% 0,100% 0,100% 100%)}
.csub .ctag svg{width:24px;height:24px}.csub .ctag small{font-weight:500;font-size:.8rem;opacity:.85;margin-inline-start:6px}
.csub .subnav{display:flex;flex-wrap:wrap;gap:12px;background:none;border:0;box-shadow:none;padding:0;margin:0;border-radius:0}

function homeNow(el){if(!el)return;clearInterval(homeNow._t);
  const mins=n=>n===1?"دقيقة":n===2?"دقيقتان":n<=10?n+" دقائق":n+" دقيقة";
  const cur=L=>{if(!L||!L.length)return{n:"—"};const m=nowMin();for(const x of L){const a=hm2min(x.f),b=hm2min(x.t);if(m>=a&&m<b){const left=Math.max(1,Math.ceil(b-m));return{n:x.n,sub:"حتى "+t12(x.t)+" · متبقٍ "+mins(left),br:!!x.br,p:Math.round((m-a)*100/Math.max(1,b-a))}}}
    if(m<hm2min(L[0].f))return{n:"قبل بدء الحصص",sub:"تبدأ "+t12(L[0].f)};if(m>=hm2min(L[L.length-1].t))return{n:"انتهت الحصص",sub:""};
    const nx=L.find(x=>hm2min(x.f)>m);return{n:"بين الحصص",sub:nx?"التالية "+nx.n+" "+t12(nx.f):""}};
  const draw=()=>{if(!document.body.contains(el)){clearInterval(homeNow._t);return}
    const d=todayStr(),s=bellSet(),study=isStudyDay(d);let lo,up;
    if(!study){const h=holidayName(d);lo=up={n:h==="ليس يوم دوام"?"لا دوام اليوم":(h||"إجازة"),sub:""}}else if(!s){lo=up={n:"لم يُحدَّد الجدول الزمني",sub:""}}else{lo=cur(s.lower);up=cur(s.upper)}
    const seg=(t,x)=>`<div class="nb-s${x.br?" br":""}"><span>${t}</span><b>${esc(x.n)}</b>${x.sub?`<small>${esc(x.sub)}</small>`:""}${x.p!=null?`<i style="--p:${x.p}%"></i>`:""}</div>`;
    const same=lo.n===up.n&&(lo.sub||"")===(up.sub||"");
    el.innerHTML=`<div class="nb-c"><b>${esc(F.time.format(new Date(Date.now()+CLOCK)))}</b><small>${esc(dayName(d))}</small></div>${same?seg("جميع الصفوف",lo):seg("الصفوف الأولية",lo)+seg("الصفوف العليا",up)}`};
  draw();homeNow._t=setInterval(draw,15000)}

function attEndTxt(){try{const b=S.settings&&S.settings.bells,c=b&&(b[b.active]||b.summer),L=c&&c.leave;return L?" (الساعة "+hmLabel(L)+")":""}catch(e){return ""}}
function mountEditor(box,o){
  offView();
  const ed={...o,key:o.g+"-"+o.c,absent:new Set(),doc:null,loadedAt:null,dirty:false,q:"",confirming:false,busy:false,loading:true};
  let alive=true;cleanup.push(()=>{alive=false});
  const tMode=()=>ed.mode==="teacher"&&S.role!=="admin";
  const lkOf=()=>ed.doc&&ed.doc.lk;
  const canNow=()=>{const l=lkOf();return !l||(l.can&&Date.now()<ed.until)};
  const locked=()=>tMode()&&(o.date!==todayStr()||!canNow());
  const minsLeft=()=>Math.max(0,Math.ceil((ed.until-Date.now())/60000));
  const tick=setInterval(()=>{if(!alive){clearInterval(tick);return}const l=lkOf();if(!tMode()||!l||!l.can)return;if(Date.now()>=ed.until){draw();return}const e=$("#edLeft",box);if(e)e.textContent=minsLeft()},20000);
  cleanup.push(()=>clearInterval(tick));
  const lockNote=d=>{if(!tMode()||o.date!==todayStr())return "";const l=d&&d.lk;
    if(!d)return `<div class="hint">بعد الحفظ يمكنك تعديل التسجيل حتى نهاية اليوم الدراسي${attEndTxt()} دون طلب، ثم يُقفل ولا يُعدِّله إلا الإدارة.</div>`;
    if(!l)return "";
    if(canNow())return `<div class="note blue">${l.unlock?"سمحت لك الإدارة بالتعديل":`يمكنك تعديل التسجيل حتى نهاية اليوم الدراسي${l.endHm?" (الساعة "+esc(hmLabel(l.endHm))+")":""} دون طلب`} — المتبقي <b id="edLeft">${minsLeft()}</b> دقيقة. يُحفظ كل تعديل في سجل العمليات.</div>`;
    const why=l.can?"انتهى اليوم الدراسي، فأُقفل التعديل.":esc(l.why);const rq=l.req;if(l.mine&&!l.unlock)return `<div class="note amber"><b>التسجيل مقفل.</b> ${why} هذا هو التسجيل المحفوظ. لتصحيح خطأ تواصل مع الإدارة.</div>`;
    const reqUI=rq&&rq.st==="pend"?`<div class="hint">أُرسل طلبك ${tm(rq.at)}، وهو بانتظار موافقة الإدارة. اضغط «تحديث» لمعرفة الرد.</div>`:
      ed.asking?`<div class="row" style="align-items:end"><label class="f" style="flex:1 1 240px">سبب طلب التعديل<input id="edRs" maxlength="300" placeholder="مثال: حضر الطالب متأخرًا"></label><div class="btns"><button class="btn sm" id="edRq"${ed.busy?" disabled":""}>إرسال الطلب</button><button class="btn sm sec" id="edRqX">إلغاء</button></div></div>`:
      `<div class="btns">${rq&&rq.st==="no"?`<span class="chip red">رُفض طلبك السابق${rq.note?": "+esc(rq.note):""}</span>`:""}<button class="btn sm gold" id="edAsk"${o.teacherId?"":" disabled"}>طلب السماح بالتعديل من الإدارة</button></div>`;
    return `<div class="note amber"><b>التسجيل مقفل.</b> ${why}${d?" هذا هو التسجيل المحفوظ.":""}${reqUI}</div>`};
  const list=studentsOf(o.g,o.c);
  function draw(){
    const d=ed.doc;const lk=locked();
    if(ed.loading){box.innerHTML=`<div class="empty">جارٍ تحميل تسجيل الفصل…</div>`;return}
    const status=d?`<span class="chip ok">مسجّل ${tm(d.lk&&d.lk.first||d.at)} · ${esc(d.lk&&d.lk.ownerName||d.teacherName||"")}</span>${d.lk&&d.lk.edits?`<span class="chip gold" title="عدد التعديلات: ${d.lk.edits}">✎ عُدِّل ${tm(d.lk.last||d.at)}${d.lk.lastSrc==="admin"?" بواسطة الإدارة":""}${d.lk.edits===2?" (مرتان)":d.lk.edits>2?` (${d.lk.edits} مرات)`:""}</span>`:""}`:`<span class="chip amber">لم يُسجَّل بعد</span>`;
    const shown=list.filter(s=>!ed.q||s.n.includes(ed.q));
    const abs=list.filter(s=>ed.absent.has(s.id));
    const noT=ed.mode==="teacher"&&!o.teacherId;
    box.innerHTML=`<div style="display:grid;gap:12px">
      <div class="ph"><b>${classLong(o.g,o.c)} · ${list.length} طالبًا</b><span style="display:flex;gap:6px;align-items:center">${status}<button class="btn sm sec" id="edR">تحديث</button></span></div>
      ${lk&&tMode()&&o.date!==todayStr()?`<div class="note amber">التسجيل متاح لليوم الحالي فقط.</div>`:lockNote(d)}
      ${noT&&!lk?`<div class="note blue">اختر اسمك من القائمة قبل الحفظ.</div>`:""}
      <input id="edQ" type="search" placeholder="ابحث عن طالب" value="${esc(ed.q)}" aria-label="بحث">
      <div class="hint">اضغط على اسم الطالب لتحديده غائبًا، واضغط مرة أخرى لإلغاء التحديد.</div>
      <div class="stus" id="edL">${shown.map(s=>`<button class="stu" data-id="${s.id}" aria-pressed="${ed.absent.has(s.id)}"${lk?" disabled":""}><span class="n">${esc(s.n)}</span><span class="s">${ed.absent.has(s.id)?"غائب":"حاضر"}</span></button>`).join("")||`<div class="empty">لا توجد نتائج.</div>`}</div>
      ${ed.confirming?`<div class="confirm"><b>${abs.length?`تأكيد الغياب (عدد الغائبين: ${abs.length})`:"تأكيد حضور جميع الطلاب"}</b>
         ${abs.length?`<ol>${abs.map(s=>`<li>${esc(s.n)}</li>`).join("")}</ol>`:""}
         <div class="btns"><button class="btn" id="edOk"${ed.busy?" disabled":""}>${ed.busy?"جارٍ الحفظ…":"تأكيد الحفظ"}</button><button class="btn sec" id="edNo">رجوع</button></div></div>`:
      `<div class="stickybar"><span class="count">الغائبون: ${abs.length}</span><div class="btns">
        <button class="btn" id="edSave"${lk||noT||ed.busy?" disabled":""}>${ed.busy?"جارٍ الحفظ والإرسال…":"حفظ وإرسال الغياب"}</button>
        ${abs.length?"":`<button class="btn blue" id="edAll"${lk||noT||ed.busy?" disabled":""}>حضور جميع الطلاب</button>`}</div></div>`}
    </div>`;
    const q=$("#edQ",box);q.oninput=()=>{ed.q=q.value.trim();const pos=q.selectionStart;draw();const n=$("#edQ",box);n.focus();try{n.setSelectionRange(pos,pos)}catch(e){}};
    $$(".stu",box).forEach(b=>b.onclick=()=>{const id=b.dataset.id;ed.absent.has(id)?ed.absent.delete(id):ed.absent.add(id);ed.dirty=true;
      b.setAttribute("aria-pressed",ed.absent.has(id));b.querySelector(".s").textContent=ed.absent.has(id)?"غائب":"حاضر";$(".count",box).textContent="الغائبون: "+ed.absent.size});
    const sv=$("#edSave",box);if(sv)sv.onclick=()=>save();
    const al=$("#edAll",box);if(al)al.onclick=()=>{ed.absent.clear();save()};
    const no=$("#edNo",box);if(no)no.onclick=()=>{ed.confirming=false;draw()};
    const ok=$("#edOk",box);if(ok)ok.onclick=save;
    $("#edR",box).onclick=load;
    const ak=$("#edAsk",box);if(ak)ak.onclick=()=>{ed.asking=true;draw();const r=$("#edRs",box);if(r)r.focus()};
    const ax=$("#edRqX",box);if(ax)ax.onclick=()=>{ed.asking=false;draw()};
    const rqb=$("#edRq",box);if(rqb)rqb.onclick=async()=>{const rs=$("#edRs",box).value.trim();if(!rs){toast("اكتب سبب طلب التعديل.","amber");return}ed.busy=true;draw();
      try{const a=S.role==="teacher"?{token:TOKEN}:{teacherId:o.teacherId};const l=await api("attRequestEdit",a,ed.key,rs,o.teacherId);ed.busy=false;ed.asking=false;if(ed.doc){ed.doc.lk=l;ed.until=Date.now()+((l&&l.left)||0)*1000}draw();toast("أُرسل طلبك إلى الإدارة.")}
      catch(e){ed.busy=false;draw();toast(e.message,"red",7000)}};
  }
  async function load(){ed.loading=true;draw();
    try{const d=await api("getClassDay",auth(),o.date,ed.key,o.teacherId);if(!alive)return;ed.loading=false;applyDoc(d)}
    catch(e){if(!alive)return;ed.loading=false;box.innerHTML=`<div class="note red">${esc(e.message)}</div>`}}
  async function save(){
    if(ed.busy)return;
    if(locked()){toast("التسجيل مقفل، فلم يُحفظ. اطلب السماح بالتعديل من الإدارة.","red");ed.confirming=false;draw();return}
    ed.busy=true;draw();
    try{
      const a=S.role==="teacher"?{token:TOKEN}:S.role==="admin"?{sid:S.sid}:{teacherId:o.teacherId};
      const r=await api("saveAttendance",a,{date:o.date,g:o.g,c:o.c,absent:[...ed.absent],loadedAt:ed.loadedAt,teacherId:o.teacherId});

  }

  load();
}

function pdfHcWrap(){const h0=window.html2canvas;if(!h0||h0.__hc)return;const w=function(el,opt){opt=Object.assign({},opt||{});const oc=opt.onclone;if(opt.scale===2.2)opt.scale=2.6;
  opt.onclone=doc=>{try{if(oc)oc(doc)}catch(e){}try{const s=doc.createElement("style");s.textContent=PRINT_HC;doc.head.appendChild(s)}catch(e){}};return h0(el,opt)};w.__hc=1;window.html2canvas=w}

/* صفحة تقرير يزيد محتواها عن الورقة: تُنقل الصفوف الزائدة إلى صفحة تالية بالترويسة نفسها بدل قصّها */
function pdfSplit1(pg){const body=pg.querySelector(".rp-body");if(!body)return null;const foot=pg.querySelector(".rp-foot");
  const lim=pg.getBoundingClientRect().top+pg.clientHeight-(foot?foot.offsetHeight+4:10);
  const rows=[...body.querySelectorAll("tbody > tr")];const bad=rows.find(r=>r.getBoundingClientRect().bottom>lim);
  const kids=[...body.children];
  if(!bad||bad.closest("table").rows[0]===bad&&!bad.parentElement.previousElementSibling){const k=kids.findIndex(c=>c.getBoundingClientRect().bottom>lim);if(k<=0)return null;
    const nx=pg.cloneNode(true);[...nx.querySelector(".rp-body").children].slice(0,k).forEach(c=>c.remove());kids.slice(k).forEach(c=>c.remove());pg.after(nx);return nx}
  const tb=bad.parentElement,tbl=tb.closest("table"),ri=[...tb.children].indexOf(bad),bi=(()=>{let b=tbl;while(b.parentElement!==body)b=b.parentElement;return kids.indexOf(b)})();
  const ti=[...pg.querySelectorAll("table")].indexOf(tbl),tbi=[...tbl.tBodies].indexOf(tb);
  if(ri<=0&&tbi<=0){if(bi<=0)return null;const nx=pg.cloneNode(true);[...nx.querySelector(".rp-body").children].slice(0,bi).forEach(c=>c.remove());kids.slice(bi).forEach(c=>c.remove());pg.after(nx);return nx}
  const nx=pg.cloneNode(true),nt=nx.querySelectorAll("table")[ti],ntb=nt.tBodies[tbi];
  [...ntb.children].slice(0,ri).forEach(r=>r.remove());[...nt.tBodies].slice(0,tbi).forEach(b=>b.remove());[...nx.querySelector(".rp-body").children].slice(0,bi).forEach(c=>c.remove());
  [...tb.children].slice(ri).forEach(r=>r.remove());[...tbl.tBodies].slice(tbi+1).forEach(b=>b.remove());kids.slice(bi+1).forEach(c=>c.remove());
  pg.after(nx);return nx}
function pdfPrep(els){pdfHcWrap();try{let split=false;const out=[];
  (els||[]).forEach(el=>{out.push(el);if(!el||!el.classList||!el.classList.contains("rp")||!el.parentElement)return;let cur=el,g=0;
    while(cur.scrollHeight>cur.clientHeight+3&&g++<80){const nx=pdfSplit1(cur);if(!nx)break;out.push(nx);cur=nx;split=true}});
  if(split){const R=out.filter(e=>e.classList&&e.classList.contains("rp"));R.forEach((e,i)=>{const f=e.querySelector(".rp-foot");if(f&&f.lastElementChild)f.lastElementChild.textContent=`صفحة ${i+1} من ${R.length}`})}
  return out}catch(e){return els}}

async function busyBtn(b,fn){const t=b.innerHTML;b.disabled=true;b.textContent="جارٍ التجهيز…";try{await fn()}catch(e){console.error(e);toast("تعذّر إنشاء الملف: "+(e&&e.message||e),"red",7000)}finally{b.disabled=false;b.innerHTML=t}}
async function saveFile(name,blob){
  const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),60000);
}

function shDiff(a,b){const o=[];const ids=new Set([...Object.keys(a||{}),...Object.keys(b||{})]);ids.forEach(id=>{const x=(a||{})[id]||[],y=(b||{})[id]||[];const n=Math.max(x.length,y.length);for(let j=0;j<n;j++)if(String(x[j]??"").trim()!==String(y[j]??"").trim())o.push([id,j])});return o}

const shAN=s=>String(s||"").replace(/[ً-ٰٟـ]/g,"").replace(/[أإآٱ]/g,"ا").replace(/ة/g,"ه").replace(/ى/g,"ي").replace(/ؤ/g,"و").replace(/ئ/g,"ي");
const shTokN=s=>shAN(s).replace(/(^|\s)عبد\s+/g,"$1عبد").split(/\s+/).filter(t=>/[\u0621-\u064A]/.test(t)).map(t=>t.length>4&&t.startsWith("ال")?t.slice(2):t);

function shPLine(raw){let parts;
  if(raw.includes("\t"))parts=raw.split("\t").map(shPClean);
  else parts=shPClean(raw).replace(/[,،;؛|:=()\[\]*_•]+/g," ").replace(/(\d)\s*[-–—.)]\s+/g,"$1 ").replace(/(^|\s)[-–—•.]+(?=\s|$)/g," ").split(/\s+/).filter(Boolean);
  const T=parts.map(p=>{if(p==="")return{e:1};const v=shPVal(p);if(v!=null)return{v};if(/[ء-ي]/.test(p))return{w:p};return null}).filter(Boolean);

const shPOk=(v,c)=>v==="غ"||(+v>=0&&(c.max==null||c.max===""||+v<=+c.max));
function shMatch(w,st,SI){const P=shTokN(w).filter(t=>!SH_FILL.has(t));if(!P.length)return{sid:"",how:"none"};
  const sc=SI.map((S0,k)=>{let i=0,m=0,pre=0,run=true;P.forEach((p,q)=>{let f=-1;for(let x=i;x<S0.length;x++)if(S0[x]===p||(p.length>=3&&S0[x].startsWith(p))){f=x;break}if(f>=0){m++;if(run&&f===q)pre++;else run=false;i=f+1}else run=false});return{k,m,pre,first:S0[0]===P[0]}});

  if(full.length===1)return{sid:st[full[0].k].id,how:"ok"};

function reportData(date,rows,snapAt){
  const T=snapAt==="now"?Infinity:tsAt(date,snapAt);
  const last={},cnt={};rows.filter(r=>Date.parse(r.at)<=T).forEach(r=>{last[r.key]=r;cnt[r.key]=(cnt[r.key]||0)+1});
  const keys=new Set(classes().map(c=>c.key));Object.keys(last).forEach(k=>keys.add(k));
  const items=[...keys].map(k=>{const[g,c]=k.split("-").map(Number);const e=last[k];
    return{g,c,rec:!!e,names:e?[...(e.names||[])].sort(coll.compare):[],teacher:e?e.teacherName:"",at:e?e.at:null,edits:e?Math.max(0,(cnt[k]||1)-1):0,editAdm:!!(e&&e.src==="admin"&&(cnt[k]||1)>1)}}).sort((a,b)=>a.g-b.g||a.c-b.c);
  const issued=snapAt==="now"?new Date().toISOString():new Date(T).toISOString();
  return{date,snapAt,items,issued,absent:items.reduce((a,x)=>a+x.names.length,0),rec:items.filter(x=>x.rec).length,unrec:items.filter(x=>!x.rec).length}
}

  av.innerHTML=`<section class="panel"><div class="ph"><h2>اليوم: ${dayName(d)} ${hijri(d)}</h2><span class="chip${isStudyDay(d)?"":" amber"}">${isStudyDay(d)?"يوم دوام":esc(holidayName(d))}</span></div>
    <div class="tiles" id="hT"><div class="tile"><span>جارٍ التحميل…</span><b>–</b></div></div><div id="hU"></div></section>
    ${S.me&&!S.me.staff?`<section class="panel"><h2>اسمي في الموقع</h2><div class="hint">يظهر في أعلى الصفحة وفي السجلات والزيارات والتقارير.</div>
     <div class="row" style="align-items:end"><label class="f">الاسم<input id="myNm" value="${esc(S.me.name||"")}" maxlength="60"></label><div class="btns"><button class="btn sec" id="myNmS">حفظ الاسم</button></div></div></section>`:""}
    <section class="panel"><h2>تغيير كلمة المرور</h2>
     <div class="row"><label class="f">كلمة المرور الحالية<input type="password" id="pw0" dir="ltr"></label><label class="f">كلمة المرور الجديدة<input type="password" id="pw1" dir="ltr"></label></div>
     <div class="btns"><button class="btn sec" id="pwS">تغيير كلمة المرور</button></div></section>`;
  {const nb=$("#myNmS");if(nb)nb.onclick=async()=>{nb.disabled=true;try{const n=await api("changeMyName",S.sid,$("#myNm").value);S.me.name=n;try{const m=JSON.parse(sessionStorage.getItem("me")||"null");if(m){m.name=n;sessionStorage.setItem("me",JSON.stringify(m))}}catch(e){}toast("حُفظ الاسم.");renderAll()}catch(e){nb.disabled=false;toast(e.message,"red",6000)}}}
  $("#pwS").onclick=async()=>{try{await api("changeMyPassword",S.sid,$("#pw0").value,$("#pw1").value);toast("تغيّرت كلمة المرور.");$("#pw0").value=$("#pw1").value=""}catch(e){toast(e.message,"red",6000)}};
  const tasks=[];
  if(has("reports")||has("attendance"))tasks.push(api("adminDay",S.sid,d).then(rows=>({rows})));else tasks.push(Promise.resolve({}));
  if(has("docs"))tasks.push(api("adminDocs",S.sid).then(docs=>({docs})));else tasks.push(Promise.resolve({}));
  Promise.all(tasks).then(([a,b])=>{if(!alive)return;const tiles=[];
    if(a.rows){const R=reportData(d,a.rows,"now");tiles.push(`<div class="tile ${R.unrec?"warn":"good"}"><span>الفصول المسجلة اليوم</span><b>${R.rec} / ${R.items.length}</b></div>`,`<div class="tile"><span>الطلاب الغائبون</span><b>${R.absent}</b></div>`);
      $("#hU").innerHTML=isStudyDay(d)&&R.unrec?`<div class="note amber">فصول لم تُسجَّل بعد: ${R.items.filter(x=>!x.rec).map(x=>classLabel(x.g,x.c)).join("، ")}</div>`:""}
    if(b.docs){const pend=b.docs.subs.filter(s=>s.status==="بانتظار المراجعة").length;tiles.push(`<div class="tile${pend?" warn":""}"><span>مستندات بانتظار المراجعة</span><b>${pend}</b></div>`)}
    tiles.push(`<div class="tile"><span>الطلاب النشطون</span><b>${activeStudents().length}</b></div>`);
    $("#hT").innerHTML=tiles.join("")}).catch(e=>{if(alive)$("#hT").innerHTML=`<div class="note red">${esc(e.message)}</div>`});
}

function absRW(av,k){const ids=S._tabIds||new Set([k]);const both=ids.has("repeat")&&ids.has("warn");
  if(!both){(k==="warn"?aWarn:aRepeat)(av);return}
  av.innerHTML=`<div class="segs"><button data-rw="repeat" aria-current="${k==="repeat"}">${ICON.att}<span>الغياب المتكرر وخطابات الاستدعاء</span></button><button data-rw="warn" aria-current="${k==="warn"}">${ICON.sheets}<span>إنذارات الغياب الرسمية</span></button></div><div id="rwBox"></div>`;
  $$("[data-rw]",av).forEach(b=>b.onclick=()=>{S.adminTab=b.dataset.rw;LS.set("atab",S.adminTab);renderView()});
  (k==="warn"?aWarn:aRepeat)($("#rwBox"));
}

function pvFormPage(o,k){o=o||{};const V=x=>x==null?"":esc(String(x)),inf=(S.settings&&S.settings.info)||{},yr=String((S.settings&&S.settings.year)||"").trim();

  const RT=`<span class="pvf-r">☐ متحقق</span><span class="pvf-r">☐ جزئيًا</span><span class="pvf-r">☐ غير متحقق</span>`;
  const tbl=(t,L)=>`<div><div class="pvf-et">${t}</div><table class="pvf-t"><thead><tr><th style="width:7%">#</th><th>المؤشّر</th><th style="width:40%">التقدير</th></tr></thead><tbody>${L.map((x,i)=>`<tr><td>${i+1}</td><td class="i">${x}</td><td>${RT}</td></tr>`).join("")}</tbody></table></div>`;
  const lines=n=>Array.from({length:n},()=>"<i></i>").join("");

   <div class="pvf-lg"><img src="${LOGO}" alt=""></div><div class="pvf-hl">العام الدراسي ${esc(/^\d{4}$/.test(yr)?yr+"هـ":yr)}<br>${esc((S.settings&&S.settings.term)||"")}</div></div>
   <div class="pvf-ti">استمارة تبادل الزيارات بين المعلمين</div>
   <div class="pvf-b"><div class="pvf-g">${box("المعلم الزائر",V(o.vn))}${box("المعلم المستضيف",V(o.hn))}${box("اليوم / التاريخ",o.d?esc(dayName(o.d)+" "+hijri(o.d)):"")}${box("الصف / الفصل",V(o.cls))}${box("الحصة",V(o.p))}${box("المادة",V(o.subj))}${box("الوحدة / عنوان الدرس","",3)}</div>

   <div class="pvf-ft"><span>${esc(SCHOOL)}</span><span>تبادل الزيارات بين المعلمين</span></div></div>`}

function aDocs(av){
  let data=null,sel=S._dReq||"";let alive=true;cleanup.push(()=>{alive=false});
  const tName=id=>teacherName(id)||"—";
  const draw=()=>{if(!alive)return;
    const reqs=data.reqs;if(!reqs.some(r=>r.id===sel))sel=reqs[0]?.id||"";S._dReq=sel;
    const r=reqs.find(x=>x.id===sel);
    const targets=r?(r.target==="all"?activeTeachers():activeTeachers().filter(t=>r.target.split(",").includes(t.id))):[];
    const subsOf=tid=>data.subs.filter(s=>s.req===sel&&s.teacher===tid);
    const cnt=req=>{const tg=req.target==="all"?activeTeachers():activeTeachers().filter(t=>req.target.split(",").includes(t.id));const done=tg.filter(t=>data.subs.some(s=>s.req===req.id&&s.teacher===t.id)).length;return `${done} / ${tg.length}`};
    const bs=(S._bsDraft||S.settings.bagSections||[]).map(x=>({...x}));S._bsDraft=bs;
    av.innerHTML=`<section class="panel"><div class="ph"><h2>أقسام حقيبة المعلم (${bs.length})</h2><button class="btn sec" id="bsAdd">+ إضافة قسم</button></div>
      <div class="hint">تظهر هذه الأقسام في حقيبة كل معلم ضمن «أعمال المعلمين». اكتب المعلومات التوضيحية سطرًا لكل معلومة، وحدّد الحجم الأقصى للملف في كل قسم (حتى 25 ميجابايت). حذف قسم يخفيه من الحقائب، وتبقى ملفاته محفوظة في Drive.</div>
      <div style="display:grid;gap:10px;margin-top:10px">${bs.map((x,i)=>`<div class="sedit"><div class="top">
        <label class="f" style="flex:1;min-width:200px">اسم القسم<input data-bt="${i}" value="${esc(x.title)}"></label>
        <label class="f" style="width:120px">الحد (ميجابايت)<input type="number" min="1" max="25" data-bm="${i}" value="${x.maxMB||20}"></label>
        <span class="btns"><button class="btn sm sec" data-bu="${i}" ${i?"":"disabled"} aria-label="تحريك لأعلى">▲</button><button class="btn sm sec" data-bdn="${i}" ${i<bs.length-1?"":"disabled"} aria-label="تحريك لأسفل">▼</button><button class="btn sm sec" data-bx="${i}">حذف</button></span></div>
        <label class="f">معلومات توضيحية تظهر تحت اسم القسم (سطر لكل معلومة)<textarea data-bd="${i}">${esc(x.details||"")}</textarea></label></div>`).join("")}</div>
      <div class="btns" style="margin-top:10px"><button class="btn" id="bsS">حفظ الأقسام</button>${S._bsDirty?'<span class="chip amber">توجد تغييرات غير محفوظة</span>':""}</div></section>
     <section class="panel"><h2>طلب مستند جديد</h2>
      <div class="row"><label class="f">اسم المستند<input id="qT" placeholder="مثال: خطة الفصل الدراسي الأول"></label><label class="f">آخر موعد (اختياري)<input type="date" id="qD"></label></div>
      <label class="f">تفاصيل (اختياري)<textarea id="qX" style="min-height:60px"></textarea></label>
      <div class="row"><label class="f">المطلوب منهم<select id="qA"><option value="all">جميع المعلمين</option><option value="some">معلمون محددون</option></select></label></div>
      <div id="qL" hidden class="btns">${activeTeachers().map(t=>`<label class="chip" style="cursor:pointer"><input type="checkbox" value="${t.id}" style="width:auto"> ${esc(t.n)}</label>`).join("")}</div>
      <div class="btns"><button class="btn" id="qS">إضافة الطلب</button></div></section>
     <section class="panel"><h2>المستندات المطلوبة وأقسام الحقيبة</h2>
      ${reqs.length?`<div class="tbl-wrap"><table class="t"><thead><tr><th>المستند</th><th>آخر موعد</th><th>المسلّمون</th><th>الحالة</th><th></th></tr></thead><tbody>
       ${reqs.map(q=>`<tr${q.id===sel?' style="background:var(--teal-soft)"':""}><td><b>${esc(q.title)}</b></td><td class="num">${q.due?esc(q.due):"—"}</td><td class="num">${cnt(q)}</td><td>${q.sec?'<span class="chip gold">قسم حقيبة</span>':q.active?'<span class="chip ok">مفعّل</span>':'<span class="chip amber">موقوف</span>'}</td>
        <td style="white-space:nowrap">${q.sec?"":`<button class="btn sm sec" data-tg="${q.id}">${q.active?"إيقاف":"تفعيل"}</button>`}</td></tr>`).join("")}</tbody></table></div>`:`<div class="empty">لم تطلب أي مستند بعد.</div>`}</section>
     <div class="note blue">مراجعة الملفات وقبولها أو إعادتها أصبحت في «المعلمون ← أعمال المعلمين» (حسب المعلم أو حسب القسم).</div>`;
    const grab=()=>{bs.forEach((x,i)=>{x.title=$(`[data-bt="${i}"]`,av).value.trim();x.details=$(`[data-bd="${i}"]`,av).value.trim();x.maxMB=Math.max(1,Math.min(25,+$(`[data-bm="${i}"]`,av).value||20))})};
    const redraw=()=>{S._bsDirty=true;draw()};
    $("#bsAdd").onclick=()=>{grab();bs.push({id:"",title:"قسم جديد",details:"",maxMB:20});redraw();setTimeout(()=>{const el=$(`[data-bt="${bs.length-1}"]`,av);if(el){el.focus();el.select()}},50)};
    $$("[data-bx]",av).forEach(b=>b.onclick=()=>{const i=+b.dataset.bx;if(b.dataset.sure!=="1"){b.dataset.sure="1";b.textContent="تأكيد الحذف";b.classList.add("gold");return}
      grab();if(bs.length<=1){toast("يجب أن يبقى قسم واحد على الأقل.","amber");return}bs.splice(i,1);redraw()});
    $$("[data-bu]",av).forEach(b=>b.onclick=()=>{const i=+b.dataset.bu;grab();[bs[i-1],bs[i]]=[bs[i],bs[i-1]];redraw()});
    $$("[data-bdn]",av).forEach(b=>b.onclick=()=>{const i=+b.dataset.bdn;grab();[bs[i+1],bs[i]]=[bs[i],bs[i+1]];redraw()});
    $$("[data-bt],[data-bd],[data-bm]",av).forEach(el=>el.oninput=()=>{S._bsDirty=true});
    $("#bsS").onclick=async()=>{grab();if(bs.some(x=>!x.title)){toast("اكتب اسمًا لكل قسم.","amber");return}
      try{const st=await api("adminSaveSettings",S.sid,{bagSections:bs});S.settings.bagSections=st.bagSections;S._bsDraft=null;S._bsDirty=false;data=await api("adminDocs",S.sid);toast("حُفظت أقسام الحقيبة.");draw()}catch(e){toast(e.message,"red")}};
    $("#qA").onchange=()=>{$("#qL").hidden=$("#qA").value!=="some"};
    $("#qS").onclick=async()=>{const title=$("#qT").value.trim();if(!title){toast("اكتب اسم المستند.","amber");return}
      const target=$("#qA").value==="all"?"all":$$("#qL input:checked").map(x=>x.value);if(target!=="all"&&!target.length){toast("اختر معلمًا واحدًا على الأقل.","amber");return}
      try{data=await api("adminSaveReq",S.sid,{title,details:$("#qX").value.trim(),due:$("#qD").value,target,active:true});sel=data.reqs[data.reqs.length-1].id;toast("أُضيف الطلب، وظهر في حقائب المعلمين المعنيين.");draw()}catch(e){toast(e.message,"red")}};
    $$("[data-sel]",av).forEach(b=>b.onclick=()=>{sel=b.dataset.sel;draw()});
    $$("[data-tg]",av).forEach(b=>b.onclick=async()=>{const q=data.reqs.find(x=>x.id===b.dataset.tg);try{data=await api("adminSaveReq",S.sid,{...q,target:q.target==="all"?"all":q.target.split(","),active:!q.active});draw()}catch(e){toast(e.message,"red")}});
    const rev=(id,status)=>async()=>{try{data=await api("adminReview",S.sid,id,status,$(`[data-nt="${id}"]`,av).value);toast(status==="مقبول"?"قُبل المستند.":"أُعيد المستند للمعلم.");draw()}catch(e){toast(e.message,"red")}};
    $$("[data-ok]",av).forEach(b=>b.onclick=rev(b.dataset.ok,"مقبول"));
    $$("[data-rt]",av).forEach(b=>b.onclick=rev(b.dataset.rt,"معاد للتعديل"));
  };
  av.innerHTML=`<div class="panel"><div class="empty">جارٍ التحميل…</div></div>`;

        gr.insertAdjacentHTML("beforeend",h);if(over()){gr.lastElementChild.remove();if(!gr.children.length)gr.parentElement.remove();np();gr=start(true);gr.insertAdjacentHTML("beforeend",h)}})})};
  const pal=["#0e7466","#2f6fb3","#7a4fb3","#b36a1f","#1f8a5c","#c0392b","#4a5b57","#0b5f8a","#8a3b6b","#3b6b8a"];
  D.units.forEach((u,ui)=>{uT=u.t;uC=u.color||pal[ui%pal.length];const P=u.parts||[u];
    const ms=(u.stats||[]).slice(0,4);const ent={t:u.t,s:u.sub,c:uC,p:pages.length,sub:[]};idx.push(ent);
    add(`<div class="paper pf pfd" style="--c:${uC}">${PF_CSS}<div class="n">القسم ${["الأول","الثاني","الثالث","الرابع","الخامس","السادس","السابع","الثامن","التاسع","العاشر","الحادي عشر","الثاني عشر"][ui]||AR(ui+1)}</div><div class="t">${esc(u.t)}</div><div class="s">${esc(u.sub||"")}</div>${ms.length?`<div class="ms">${ms.map(x=>`<div><b>${esc(String(x.v))}${esc(x.u||"")}</b><span>${esc(x.l)}</span></div>`).join("")}</div>`:""}</div>`);
    np();P.forEach((p,pi)=>{const stH=x=>x&&x.length?`<div class="pf-st"${u.parts?' style="grid-template-columns:repeat(6,1fr)"':""}>${x.map(y=>`<div class="pf-sc"><b>${esc(String(y.v))}${y.u?`<small style="font-size:.55em">${esc(y.u)}</small>`:""}</b><span>${esc(y.l)}</span></div>`).join("")}</div>`:"";
      if(u.parts){if(!p.spHead&&(p.ev||[]).length&&body.children.length)np();
        const hd=`${p.spHead?`<div class="pf-sp">التخصص: ${esc(p.spHead)}</div>`:""}<div class="pf-tp"><div class="av">${esc((p.n||"م").trim()[0])}</div><div><b>${esc(p.n)}</b><small>${esc(p.sub||"")}</small></div></div>${stH(p.stats)}`;
        block(`<div style="display:flex;flex-direction:column;gap:10px">${hd}</div>`);if(p.spHead)ent.sub.push({t:"معلمو "+p.spHead,p:pages.length-1});else if(!u.parts.some(x=>x.spHead))ent.sub.push({t:p.n,p:pages.length-1})}
      else block(stH(p.stats)||"<div></div>");
      (p.tables||[]).forEach(table);evs(p.ev)})});
  /* الفهرس */
  const ix=ixP.querySelector("#pfIx");ix.innerHTML=idx.map(e=>`<div class="pfi-r" style="--c:${e.c}"><i></i><span>${esc(e.t)}<br><small>${esc(e.s||"")}</small></span><em>${AR(e.p+1)}</em></div>${e.sub.length&&e.sub.length<=40?`<div class="pfi-g">${e.sub.map(x=>`<div class="pfi-s"><span>${esc(x.t)}</span><span>${AR(x.p+1)}</span></div>`).join("")}</div>`:""}`).join("");
  while(ix.scrollHeight>ix.clientHeight+1&&ix.querySelector(".pfi-g"))ix.querySelector(".pfi-g").remove();
  pages.forEach((p,i)=>{const f=p.querySelector(".pf-ft");if(f)f.innerHTML=`<span>${esc(H.school||SCHOOL)} · ${esc(o.title||"ملف الإنجاز")}</span><span>صفحة ${AR(i+1)} من ${AR(pages.length)}</span>`});
  await new Promise(r=>setTimeout(r,80));await elsToPdf(pages,`${o.title||"ملف الإنجاز"}.pdf`);toast(`اكتمل ملف الإنجاز (${AR(pages.length)} صفحة).`)}
